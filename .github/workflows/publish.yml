name: Publish

# One entry point for a release: Actions -> Publish -> Run workflow.
#
# It verifies the tree, publishes to npm and creates the GitHub release, in that
# order. The version comes from package.json, which the release pull request
# already set — bumping it stays a reviewable change, because the CHANGELOG has
# to be written by a person anyway. Everything after that point is mechanical,
# and this is that part.
#
# `dry_run` defaults to true, so the default action of the button is the
# harmless one. A rehearsal runs every check and publishes nothing.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearse only: run every check and publish nothing'
        type: boolean
        default: true

permissions:
  # create the tag and the GitHub release
  contents: write
  # npm provenance
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    # NPM_TOKEN is a secret of this environment, and an environment's secrets
    # are only visible to a job that declares it. Declaring it also means the
    # environment's protection rules apply, so adding required reviewers there
    # turns a real publish into something that has to be approved.
    environment: production

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # .nvmrc; npm 10 ships here, which is what --provenance needs
          node-version: '22'
          cache: yarn

      # the repo pins yarn via packageManager
      - run: corepack enable

      - run: yarn install --frozen-lockfile

      - name: Read the version
        id: version
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          {
            echo "name=${name}"
            echo "version=${version}"
            echo "tag=v${version}"
          } >> "$GITHUB_OUTPUT"
          echo "releasing ${name}@${version}"

      # These cost a second or two and the gate below costs minutes. Both are
      # states you cannot publish out of, and npm never allows a version to be
      # republished, so finding out here rather than at the last step matters.
      - name: Check the version is not already released
        env:
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${TAG} already exists. Bump the version in package.json first."
            exit 1
          fi
          # tested on output rather than exit code, which npm has not been
          # consistent about across majors
          if [ -n "$(npm view "${NAME}@${VERSION}" version 2>/dev/null)" ]; then
            echo "::error::${NAME}@${VERSION} is already on npm, and npm never allows republishing a version."
            exit 1
          fi
          echo "${VERSION} is unreleased on both npm and this repository"

      # The CHANGELOG entry is what the GitHub release will say. Generated notes
      # are a list of merged pull requests, which puts "stop setup-node's .npmrc
      # breaking every yarn step" next to the reason the library got faster, and
      # leaves the release and the CHANGELOG telling different stories.
      #
      # It doubles as a guard: the script exits non-zero when the section is
      # missing or empty, and a version nobody wrote an entry for is not ready
      # to publish.
      - name: Build the release notes from the CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/changelog-section.mjs "$VERSION" > "${RUNNER_TEMP}/notes.md"
          # the release being made does not exist yet, so the latest one is the
          # previous one
          previous="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            {
              echo
              echo '---'
              echo
              echo "**Full changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous}...v${VERSION}"
            } >> "${RUNNER_TEMP}/notes.md"
          fi
          echo "release notes: $(wc -l < "${RUNNER_TEMP}/notes.md") lines from the CHANGELOG"

      # A missing token otherwise surfaces as an npm 403 after the whole gate
      # has run, which reads like a problem with the account rather than a
      # secret that is not reaching the job.
      - name: Check the npm token is present
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is reaching this job"
          elif [ "$DRY_RUN" = "true" ]; then
            echo "::warning::NPM_TOKEN is empty, so this rehearsal cannot check authentication."
          else
            echo "::error::NPM_TOKEN is empty. It must be a secret of the production environment."
            exit 1
          fi

      # CI already ran these on the merge commit, but a publish cannot be undone
      # and this workflow can be run from any ref.
      - run: yarn lint

      - run: yarn type-check

      - run: yarn test

      - run: yarn build

      - run: yarn check-build

      - run: yarn check-package

      # npm is pointed at the registry only now, and deliberately in a second
      # setup-node step rather than the one above. `registry-url` writes an
      # .npmrc holding the literal `${NODE_AUTH_TOKEN}` for npm to expand at
      # publish time, but yarn 1 reads .npmrc too and aborts on a variable that
      # is not set — "Failed to replace env in config" — and `cache: yarn`
      # triggers exactly that by shelling out to `yarn cache dir`. So everything
      # yarn touches has to run before this file exists.
      #
      # It also keeps the publish token out of the environment of the install,
      # test and build steps, which are the steps that run third-party code.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # --ignore-scripts so that what ships is exactly the tree just verified,
      # rather than a rebuild npm triggers through prepublishOnly and that
      # nothing has checked. Provenance is left to real publishes: a dry run has
      # nothing to attest.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          EXTRA: ${{ inputs.dry_run && '--dry-run' || '--provenance' }}
        run: npm publish --access public --ignore-scripts $EXTRA

      # After npm, because npm is the half that cannot be undone: a GitHub
      # release is deleted in a click, a published version is not. If this step
      # fails the package is already correctly on npm and the release can be
      # created by hand, which is the better way round to fail.
      - name: Create the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file "${RUNNER_TEMP}/notes.md"

      # The run page otherwise looks identical whether or not anything was
      # published, which is genuinely confusing when the default is a rehearsal.
      - name: Say what happened
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            if [ -z "$VERSION" ]; then
              echo "## Stopped before reading the version"
              echo
              echo "Nothing was published."
            elif [ "$DRY_RUN" = "true" ]; then
              echo "## Rehearsal only — nothing was published"
              echo
              echo "Verified \`${NAME}@${VERSION}\`. No npm release, no tag, no GitHub release."
              echo
              echo "To publish for real, run this workflow again with **Rehearse only** unchecked."
              if [ -f "${RUNNER_TEMP}/notes.md" ]; then
                echo
                echo "<details><summary>Release notes this would publish</summary>"
                echo
                cat "${RUNNER_TEMP}/notes.md"
                echo
                echo "</details>"
              fi
            elif [ "${{ job.status }}" != "success" ]; then
              echo "## Failed while releasing ${VERSION}"
              echo
              echo "Check the failed step above before retrying."
            else
              echo "## Published ${NAME}@${VERSION}"
              echo
              echo "- [npm](https://www.npmjs.com/package/${NAME}/v/${VERSION})"
              echo "- [release](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
