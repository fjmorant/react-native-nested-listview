name: Greetings

on:
  issues:
    types: [opened]
  # first-interaction needs a writable token to comment on pull requests from
  # forks, which `pull_request` does not provide. This workflow only posts a
  # comment and never checks out the contributor's code.
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: >
            Thanks for opening your first issue here. A maintainer will review
            it soon.
          pr_message: >
            Thanks for your first pull request — contributions like this are
            what keep the library going. A maintainer will take a look shortly.
