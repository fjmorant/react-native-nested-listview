name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # React Native 0.87 supports ^22.13.0 || ^24.3.0 || >=26.0.0
        node-version: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      # the repo pins yarn via packageManager
      - run: corepack enable

      - run: yarn install --frozen-lockfile

      - run: yarn lint

      - run: yarn type-check

      - run: yarn test

      - name: Upload coverage to Codecov
        # one upload is enough; the matrix legs produce identical coverage
        if: matrix.node-version == '22'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
