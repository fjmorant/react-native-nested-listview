name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # React Native 0.87 supports ^22.13.0 || ^24.3.0 || >=26.0.0
        node-version: ['22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      # the repo pins yarn via packageManager
      - run: corepack enable

      - run: yarn install --frozen-lockfile

      - run: yarn lint

      - run: yarn type-check

      - run: yarn test

      # the published output is plain JS, but the base tsconfig preserves JSX
      # for Metro; if the build loses its override, dist ships unparseable
      # files. Resolution checks do not notice, so parse them.
      - name: Check the build parses
        if: matrix.node-version == '22'
        run: yarn build && yarn check-build

      # entrypoints and types agree with the JS, across all resolution modes
      - name: Check published package
        if: matrix.node-version == '22'
        run: yarn check-package

      - name: Upload coverage to Codecov
        # one upload is enough; the matrix legs produce identical coverage
        if: matrix.node-version == '22'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
